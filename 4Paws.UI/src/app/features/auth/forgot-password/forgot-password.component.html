<div class="auth-wrapper">
  <div class="auth-card">

    <div class="brand">
      <span class="brand-icon">🔑</span>
      <h1>Forgot password?</h1>
      <p>We'll send a reset code to your email</p>
    </div>

    <form (ngSubmit)="onSubmit()">

      <div class="field">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="error-msg" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="success-msg" *ngIf="successMessage">
        ✅ {{ successMessage }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading || codeSent">
        <span *ngIf="!isLoading">Send reset code</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

    </form>

    <p class="alt-link">
      Remember your password? <a routerLink="/login">Sign in</a>
    </p>

  </div>
</div>
