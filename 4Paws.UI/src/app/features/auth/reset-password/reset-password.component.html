<div class="auth-wrapper">
  <div class="auth-card">

    <div class="brand">
      <span class="brand-icon">🔐</span>
      <h1>Reset password</h1>
      <p>Enter the code from your email</p>
    </div>

    <form (ngSubmit)="onSubmit()">

      <div class="field">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="form.email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="field">
        <label for="code">Reset code</label>
        <input
          id="code"
          type="text"
          name="code"
          [(ngModel)]="form.code"
          placeholder="123456"
          maxlength="6"
          class="code-input"
          autocomplete="one-time-code"
          required
        />
      </div>

      <div class="field">
        <label for="password">New password</label>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="form.password"
            placeholder="••••••••"
            autocomplete="new-password"
            required
          />
          <button type="button" class="toggle-pw" (click)="togglePassword()">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <div class="password-wrapper">
          <input
            id="confirmPassword"
            [type]="showConfirm ? 'text' : 'password'"
            name="confirmPassword"
            [(ngModel)]="form.confirmPassword"
            placeholder="••••••••"
            autocomplete="new-password"
            required
          />
          <button type="button" class="toggle-pw" (click)="toggleConfirm()">
            {{ showConfirm ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <div class="error-msg" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="success-msg" *ngIf="successMessage">
        ✅ {{ successMessage }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Reset password</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

    </form>

    <p class="alt-link">
      Back to <a routerLink="/login">Sign in</a>
    </p>

  </div>
</div>
