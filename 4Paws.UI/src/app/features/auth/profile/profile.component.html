<div class="profile-wrapper">

  <!-- Loading -->
  <div class="loading" *ngIf="isLoading">
    <div class="spinner"></div>
    <p>Loading profile...</p>
  </div>

  <!-- Error -->
  <div class="error-msg" *ngIf="errorMessage && !isLoading">
    {{ errorMessage }}
  </div>

  <!-- Profile card -->
  <div class="profile-card" *ngIf="user && !isLoading">

    <div class="card-header">
      <div class="avatar">{{ getInitials() }}</div>
      <div class="user-info">
        <h1>{{ user.firstName }} {{ user.lastName }}</h1>
        <p>{{ user.email }}</p>
      </div>
      <button class="btn-logout" (click)="logout()">Log out</button>
    </div>

    <div class="divider"></div>

    <div class="details">
      <div class="detail-row">
        <span class="label">First name</span>
        <span class="value">{{ user.firstName }}</span>
      </div>
      <div class="detail-row">
        <span class="label">Last name</span>
        <span class="value">{{ user.lastName }}</span>
      </div>
      <div class="detail-row">
        <span class="label">Email</span>
        <span class="value">{{ user.email }}</span>
      </div>
      <div class="detail-row" *ngIf="user.phoneNumber">
        <span class="label">Phone</span>
        <span class="value">{{ user.phoneNumber }}</span>
      </div>
      <div class="detail-row" *ngIf="user.createdAt">
        <span class="label">Member since</span>
        <span class="value">{{ user.createdAt | date:'mediumDate' }}</span>
      </div>
    </div>

  </div>

</div>
