<div class="container">
  <h2>Available Pets at 4Paws</h2>

  <div class="pet-grid">
    @for (pet of listingService.listings(); track pet.id) {
      <div class="pet-card">
        <img [src]="pet.imageUrl || 'assets/placeholder-pet.png'" [alt]="pet.name">
        <div class="pet-info">
          <h3>{{ pet.name }}</h3>
          <p><strong>Breed:</strong> {{ pet.breed }}</p>
          <p><strong>Age:</strong> {{ pet.age }} years old</p>
          <p class="description">{{ pet.description }}</p>
          <button class="btn-primary">View Details</button>
        </div>
      </div>
    } @empty {
      <div class="empty-state">
        <p>No pets found. Check back later!</p>
      </div>
    }
  </div>
</div>
